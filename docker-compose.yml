services:
  # 1. Cơ sở dữ liệu SQL Server 2022
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: gym_sqlserver
    restart: always
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=GymAppPassword123!
    ports:
      # Ánh xạ ra cổng 14333 của máy thật để KHÔNG bị xung đột với SQL Server có sẵn trên máy (cổng 1433)
      - "14333:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'GymAppPassword123!' -C -Q 'SELECT 1' > /dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 25
      start_period: 10s

  # 2. Tự động nạp Database và dữ liệu mẫu (chỉ chạy một lần khi SQL Server sẵn sàng)
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: gym_db_init
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ./Database/full_database.sql:/full_database.sql:ro
    entrypoint:
      - /bin/bash
      - -c
      - |
        DB_EXISTS=$$(/opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "GymAppPassword123!" -C -h -1 -W -Q "SET NOCOUNT ON; SELECT CASE WHEN DB_ID('QuanLyPhongGym') IS NOT NULL THEN 1 ELSE 0 END" | tr -d '\r\n ')
        if [ "$$DB_EXISTS" = "1" ]; then
          echo "✅ CSDL QuanLyPhongGym đã tồn tại, bỏ qua bước khởi tạo lại."
          exit 0
        fi
        echo "SQL Server đã sẵn sàng! Đang chuẩn hóa định dạng và nạp CSDL QuanLyPhongGym..."
        tr -d '\r' < /full_database.sql > /tmp/full_database.sql
        /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "GymAppPassword123!" -C -i /tmp/full_database.sql
        echo "✅ Đã nạp thành công CSDL QuanLyPhongGym!"
        exit 0

  # 3. Backend API Node.js Express (chỉ bật khi database đã được nạp xong 100%)
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: gym_backend
    restart: always
    environment:
      - PORT=5000
      - DB_SERVER=sqlserver
      - DB_PORT=1433
      - DB_USER=sa
      - DB_PASSWORD=GymAppPassword123!
      - DB_NAME=QuanLyPhongGym
      - JWT_SECRET=super_secret_gym_key_2026_@!
    ports:
      - "5000:5000"
    depends_on:
      sqlserver:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully

  # 4. Frontend React Vite (Nginx)
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: gym_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  sqlserver_data:
